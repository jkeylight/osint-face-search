[package]
name = "aether-desktop"
version = "0.1.0"
description = "AETHER-STREAM desktop shell"
authors = ["AETHER-STREAM contributors"]
edition = "2021"
license = "Apache-2.0 OR MIT"
build = "build.rs"

[lib]
name = "aether_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aether-stream"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2.4"

[dependencies]
aether-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tokio.workspace = true
tracing = "0.1"
url = "2.5"
