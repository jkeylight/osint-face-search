[package]
name = "aether-desktop"
version = "0.1.0"
description = "AETHER-STREAM desktop shell"
authors = ["AETHER-STREAM contributors"]
edition = "2021"
license = "Apache-2.0 OR MIT"
build = "build.rs"

[lib]
name = "aether_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aether-stream"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
aether-core.workspace = true
anyhow.workspace = true
keyring = { version = "3.6", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-biometry = "0.3.0-rc.1"
tokio.workspace = true
tracing = "0.1"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
zeroize = "1.8"
