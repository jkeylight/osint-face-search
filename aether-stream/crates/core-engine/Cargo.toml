[package]
name = "aether-core"
version = "0.1.0"
edition = "2021"
description = "Local-first segmented download engine for AETHER-STREAM"
license = "Apache-2.0 OR MIT"

[dependencies]
bytes = "1.10"
futures-util = "0.3"
reqwest = { version = "0.12.23", default-features = false, features = [
  "rustls-tls",
  "http2",
  "http3",
  "stream",
  "gzip",
  "brotli",
  "deflate",
  "json",
] }
# SQLCipher keeps queue metadata and the Argon2id verifier encrypted at rest.
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.47", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1.7"
